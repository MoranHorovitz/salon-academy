<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המדריך שלך מוכן | Salon Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap');
:root{--bg:#0a0a0a;--bg2:#111;--lime:#c6ff00;--border:rgba(255,255,255,0.07);--text:#f0f0f0;--muted:#666;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{max-width:480px;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:44px 36px;text-align:center;}
.icon{font-size:52px;margin-bottom:18px;animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes pop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
h1{font-size:28px;font-weight:900;color:#fff;margin-bottom:10px;}
.sub{font-size:15px;color:#aaa;margin-bottom:28px;line-height:1.7;}
.type-badge{display:inline-block;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--lime);background:rgba(198,255,0,0.08);border:1px solid rgba(198,255,0,0.2);border-radius:20px;padding:8px 18px;margin-bottom:24px;}
.btn{display:block;background:var(--lime);color:#000;font-family:'Heebo',sans-serif;font-size:17px;font-weight:800;padding:16px;border-radius:12px;text-decoration:none;text-align:center;transition:all 0.2s;margin-bottom:10px;}
.btn:hover{background:#d4ff33;}
.btn-ghost{display:block;font-size:13px;color:var(--muted);text-decoration:none;text-align:center;padding:8px;}
.btn-ghost:hover{color:var(--text);}
footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div>
<div class="card">
  <div class="icon" id="type-icon">🌟</div>
  <h1>תשלום התקבל!</h1>
  <div class="type-badge" id="type-badge">טוענת את המדריך...</div>
  <p class="sub" id="type-sub">המדריך האישי שלך מוכן - נכתב במיוחד בשבילך</p>
  <a href="#" id="guide-btn" class="btn">פתחי את המדריך שלי ←</a>
  <a href="/" class="btn-ghost">חזרה לדף הבית</a>
</div>
<footer>Salon Academy</footer>
</div>

<script>
const TYPES = {
  a: { icon: '🤝', name: 'המחברת' },
  b: { icon: '🏗️', name: 'הבונה' },
  c: { icon: '✨', name: 'היוצרת' },
  d: { icon: '⚡', name: 'המניעה' },
  e: { icon: '🔬', name: 'החוקרת' },
  f: { icon: '🌐', name: 'הרב תחומית' },
};

const params = new URLSearchParams(window.location.search);
const type = (params.get('type') || 'f').toLowerCase();
const t = TYPES[type] || TYPES['f'];

document.getElementById('type-icon').textContent = t.icon;
document.getElementById('type-badge').textContent = 'את ' + t.name;
document.getElementById('type-sub').textContent = 'המדריך "שעה אחת בשבוע" - ' + t.name + ' - נכתב בדיוק עבור הסוג שלך';
document.getElementById('guide-btn').href = '/guides/guide-' + type + '.html';

// Auto-redirect after 3 seconds
setTimeout(() => {
  window.location.href = '/guides/guide-' + type + '.html';
}, 3000);
</script>
</body>
</html>
