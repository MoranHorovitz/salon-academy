<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המדריך שלך מוכן | Salon Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap');
:root{--bg:#0a0a0a;--bg2:#111;--lime:#c6ff00;--border:rgba(255,255,255,0.07);--text:#f0f0f0;--muted:#666;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.card{max-width:460px;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:44px 36px;text-align:center;}
.icon{font-size:52px;margin-bottom:18px;animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes pop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
h1{font-size:26px;font-weight:900;color:#fff;margin-bottom:8px;}
.sub{font-size:15px;color:#aaa;margin-bottom:24px;line-height:1.7;}
.type-badge{display:inline-block;font-size:13px;font-weight:700;color:var(--lime);background:rgba(198,255,0,0.08);border:1px solid rgba(198,255,0,0.2);border-radius:20px;padding:8px 18px;margin-bottom:24px;}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--lime);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.btn{display:block;background:var(--lime);color:#000;font-family:'Heebo',sans-serif;font-size:17px;font-weight:800;padding:16px;border-radius:12px;text-decoration:none;text-align:center;transition:all 0.2s;margin-bottom:10px;}
.btn:hover{background:#d4ff33;}
.btn-ghost{display:block;font-size:13px;color:var(--muted);text-decoration:none;text-align:center;padding:8px;}
.btn-ghost:hover{color:var(--text);}
footer{margin-top:20px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1>תשלום התקבל!</h1>
  <p class="sub">מחפשת את המדריך שלך...</p>
  <div class="spinner" id="spinner"></div>
  <div id="cta" style="display:none"></div>
</div>
<footer>Salon Academy</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://sbuwxhijqfdrznblnieb.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidXd4aGlqcWZkcnpuYmxuaWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNjAzNDcsImV4cCI6MjA5MjkzNjM0N30.WCPTa7vRQ77MeMAigjbYMKONkXiRH-ynlpzPrXBrPbM';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

const TYPES = {
  a: { icon: '🤝', name: 'המחברת' },
  b: { icon: '🏗️', name: 'הבונה' },
  c: { icon: '✨', name: 'היוצרת' },
  d: { icon: '⚡', name: 'המניעה' },
  e: { icon: '🔬', name: 'החוקרת' },
  f: { icon: '🌐', name: 'הרב תחומית' },
};

async function init() {
  const spinner = document.getElementById('spinner');
  const cta = document.getElementById('cta');

  // 1. Get session
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    // Not logged in — ask to login first
    spinner.style.display = 'none';
    cta.style.display = 'block';
    cta.innerHTML = `
      <p style="color:#aaa;font-size:14px;margin-bottom:16px">יש להתחבר כדי לגשת למדריך</p>
      <a href="/login.html?redirect=/thank-you-guide.html" class="btn">כניסה לחשבון ←</a>
      <a href="/" class="btn-ghost">חזרה לדף הבית</a>`;
    return;
  }

  // 2. Get personality type from user metadata
  const { data: { user } } = await sb.auth.getUser();
  let type = user?.user_metadata?.personality_type;

  // 3. Fallback: check quiz_leads table
  if (!type) {
    const { data } = await sb
      .from('quiz_leads')
      .select('result')
      .eq('email', user.email)
      .not('result', 'is', null)
      .order('created_at', { ascending: false })
      .limit(1)
      .maybeSingle();
    if (data?.result) type = data.result.charAt(0).toLowerCase();
  }

  // 4. Still no type? Show manual type selection
  if (!type || !TYPES[type]) {
    spinner.style.display = 'none';
    cta.style.display = 'block';
    cta.innerHTML = `
      <p style="color:#aaa;font-size:14px;margin-bottom:20px">מילאת את השאלון? בחרי את הסוג שלך:</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
        ${Object.entries(TYPES).map(([k,t]) => `
          <button onclick="selectType('${k}')"
            style="background:#181818;border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px;cursor:pointer;font-family:inherit;color:#f0f0f0;font-size:14px;font-weight:700;transition:all 0.15s;text-align:center"
            onmouseover="this.style.borderColor='#c6ff00';this.style.color='#c6ff00'"
            onmouseout="this.style.borderColor='rgba(255,255,255,0.1)';this.style.color='#f0f0f0'">
            ${t.icon}<br>${t.name}
          </button>`).join('')}
      </div>
      <a href="/salon-quiz.html" style="font-size:12px;color:#666;text-decoration:none;display:block;text-align:center">עדיין לא עשית את השאלון? לחצי כאן</a>`;
    return;
  }

  // 5. Save purchase to metadata + purchases table
  await sb.auth.updateUser({
    data: { guide_purchased_at: new Date().toISOString(), personality_type: type }
  });
  // Also insert into purchases table so markPurchases() works on homepage
  const { data: existingPurchase } = await sb
    .from('purchases')
    .select('product_id')
    .eq('user_id', user.id)
    .eq('product_id', 'quiz-guide')
    .maybeSingle();
  if (!existingPurchase) {
    await sb.from('purchases').insert({ user_id: user.id, product_id: 'quiz-guide' });
  }

  // 6. Show result + redirect
  const t = TYPES[type];
  document.querySelector('.icon').textContent = t.icon;
  document.querySelector('h1').textContent = 'תשלום התקבל!';
  document.querySelector('.sub').textContent = `המדריך של ${t.name} מוכן לך`;
  spinner.style.display = 'none';
  cta.style.display = 'block';
  cta.innerHTML = `
    <div class="type-badge">את ${t.name}</div>
    <a href="/guides/guide-${type}.html" class="btn">פתחי את המדריך שלי ←</a>
    <a href="/" class="btn-ghost">חזרה לדף הבית</a>`;

  // Auto-redirect after 3 seconds
  setTimeout(() => window.location.href = `/guides/guide-${type}.html`, 3000);
}

async function selectType(t) {
  // Save to user metadata
  try {
    await sb.auth.updateUser({
      data: { personality_type: t, personality_name: TYPES[t].name }
    });
  } catch(e) {}
  // Redirect to guide
  window.location.href = '/guides/guide-' + t + '.html';
}

init();
</script>
</body>
</html>
