<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ברוכה הבאה! | Salon Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap');
:root{--bg:#080808;--bg2:#111;--lime:#c6ff00;--border:rgba(255,255,255,0.07);--text:#f0f0f0;--muted:#666;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.card{max-width:480px;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:44px 36px;text-align:center;}
@media(max-width:500px){.card{padding:32px 20px;}}
.icon{font-size:52px;margin-bottom:18px;animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes pop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
h1{font-size:28px;font-weight:900;color:#fff;margin-bottom:10px;line-height:1.2;}
.sub{font-size:15px;color:#aaa;margin-bottom:28px;line-height:1.7;}
.progress-bar{height:3px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;margin-bottom:28px;}
.progress-fill{height:100%;background:var(--lime);border-radius:2px;animation:fill 2s ease-out forwards;}
@keyframes fill{from{width:0%;}to{width:100%;}}
.status-box{border-radius:12px;padding:16px 20px;margin-bottom:24px;font-size:14px;display:flex;align-items:center;gap:10px;justify-content:center;}
.status-box.loading{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);}
.status-box.success{background:rgba(198,255,0,0.07);border:1px solid rgba(198,255,0,0.25);color:var(--lime);font-weight:700;}
.status-box.error{background:rgba(255,60,60,0.07);border:1px solid rgba(255,60,60,0.25);color:#ff6060;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.15);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.btn{display:block;background:var(--lime);color:#000;font-family:'Heebo',sans-serif;font-size:16px;font-weight:800;padding:15px;border-radius:12px;text-decoration:none;text-align:center;transition:all 0.2s;margin-bottom:10px;border:none;cursor:pointer;width:100%;}
.btn:hover{background:#d4ff33;}
.btn-ghost{display:block;background:transparent;color:var(--muted);font-family:'Heebo',sans-serif;font-size:13px;padding:10px;text-decoration:none;text-align:center;}
.btn-ghost:hover{color:var(--text);}

/* Register form (shown when not logged in) */
.register-form{text-align:right;}
.register-form h3{font-size:17px;font-weight:800;color:#fff;margin-bottom:6px;text-align:center;}
.register-form p{font-size:13px;color:var(--muted);margin-bottom:18px;text-align:center;line-height:1.5;}
.inp{width:100%;background:#181818;border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 18px;font-family:'Heebo',sans-serif;font-size:15px;color:var(--text);outline:none;margin-bottom:10px;text-align:right;transition:border-color 0.2s;}
.inp:focus{border-color:var(--lime);}
.inp::placeholder{color:var(--muted);}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1>ברוכה הבאה!</h1>
  <p class="sub" id="main-sub">מוסיפה אותך לקורס...</p>
  <div class="progress-bar"><div class="progress-fill"></div></div>
  <div class="status-box loading" id="status-box">
    <div class="spinner"></div>
    <span id="status-text">מעבדת את הגישה שלך...</span>
  </div>
  <div id="cta-area" style="display:none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const courseId = urlParams.get('course') || COURSE_ID || 'reels';
const courseUrl = '/courses/' + courseId + '/';

const COURSE_NAMES = {
  'reels': 'לא משתעבדת לתוכן',
};
const courseName = COURSE_NAMES[courseId] || 'הקורס';

document.getElementById('main-sub').textContent = 'תודה שרכשת את "' + courseName + '"! מוסיפה גישה...';

async function sendWelcomeEmail(session) {
  try {
    await fetch('/api/send-guide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: session.user.email,
        name: session.user.user_metadata?.full_name || '',
        course: courseId,
        courseName,
      }),
    });
  } catch(e) { console.warn('email:', e); }
}

async function enrollUser(session) {
  const userId = session.user.id;
  const { data: existing } = await sb.from('enrollments').select('id')
    .eq('user_id', userId).eq('course_id', courseId).maybeSingle();
  if (existing) return true;
  const { error } = await sb.from('enrollments').insert({ user_id: userId, course_id: courseId });
  return !error;
}

function showSuccess() {
  const box = document.getElementById('status-box');
  box.className = 'status-box success';
  box.innerHTML = '✓ הגישה לקורס הופעלה!';
  document.getElementById('cta-area').style.display = 'block';
  document.getElementById('cta-area').innerHTML = `
    <a href="${courseUrl}" class="btn">כניסה לקורס ←</a>
    <a href="/" class="btn-ghost">חזרה לקטלוג</a>`;
  setTimeout(() => window.location.href = courseUrl, 3000);
}

function showRegisterForm() {
  document.getElementById('status-box').style.display = 'none';
  document.getElementById('cta-area').style.display = 'block';
  document.getElementById('cta-area').innerHTML = `
    <div class="register-form">
      <h3>צרי חשבון לגישה לקורס</h3>
      <p>כדי לגשת לקורס צריך חשבון — ייקח שנייה</p>
      <input class="inp" type="text" id="reg-name" placeholder="שם מלא" required>
      <input class="inp" type="email" id="reg-email" placeholder="אימייל" required>
      <input class="inp" type="password" id="reg-pass" placeholder="סיסמה (לפחות 8 תווים)" required minlength="8">
      <button class="btn" onclick="doRegister()" style="margin-top:6px">יצירת חשבון וכניסה ←</button>
      <a href="/login.html?redirect=${encodeURIComponent(window.location.href)}" class="btn-ghost">כבר יש לי חשבון</a>
    </div>`;
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  if (!name || !email || pass.length < 8) return;

  const btn = document.querySelector('#cta-area .btn');
  btn.disabled = true; btn.textContent = 'יוצרת חשבון...';

  const { data, error } = await sb.auth.signUp({
    email, password: pass,
    options: { data: { full_name: name } }
  });

  if (error) {
    btn.disabled = false; btn.textContent = 'יצירת חשבון וכניסה ←';
    alert(error.message); return;
  }

  if (data.session) {
    await enrollUser(data.session);
    await sendWelcomeEmail(data.session);
    showSuccess();
  } else {
    document.getElementById('cta-area').innerHTML = `
      <div class="status-box success" style="margin-bottom:16px">✓ נשלח מייל אימות — בדקי את תיבת הדואר</div>
      <a href="/login.html?redirect=${encodeURIComponent(courseUrl)}" class="btn">כניסה לאחר אימות ←</a>`;
  }
}

// Main flow
setTimeout(async () => {
  const { data: { session } } = await sb.auth.getSession();

  if (session) {
    // Logged in — enroll + welcome email + go to course
    document.getElementById('status-text').textContent = 'מפעילה גישה...';
    await enrollUser(session);
    await sendWelcomeEmail(session);
    showSuccess();
  } else {
    // Not logged in — show register form
    document.getElementById('status-text').textContent = 'צרי חשבון לגישה לקורס';
    showRegisterForm();
  }
}, 1500);
</script>
</body>
</html>
