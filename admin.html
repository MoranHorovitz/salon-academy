<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול קורס - לא משתעבדת לתוכן</title>
<link rel="stylesheet" href="styles.css">
<style>
.admin-form{background:rgba(255,255,255,0.04);border:1px solid rgba(255,60,190,0.2);border-radius:16px;padding:32px;margin-bottom:32px}
.admin-form h2{font-size:18px;font-weight:700;color:#ff3cbe;margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-group{display:flex;flex-direction:column;gap:8px}
.form-group label{font-size:13px;color:rgba(255,255,255,0.5);font-weight:600;letter-spacing:1px}
.form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 16px;color:white;font-family:'Heebo',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#ff3cbe}
.form-group select option{background:#1a0a2e;color:white}
.btn-add{background:#ff3cbe;color:white;font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;padding:12px 28px;border-radius:10px;border:none;cursor:pointer;transition:background 0.2s}
.btn-add:hover{background:#e0359f}
.content-list{display:flex;flex-direction:column;gap:12px}
.content-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.content-item .item-info h4{font-size:15px;font-weight:700;margin-bottom:4px}
.content-item .item-info span{font-size:12px;color:rgba(255,255,255,0.4)}
.content-item .item-type{background:rgba(255,60,190,0.15);color:#ff3cbe;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:1px}
.btn-delete{background:rgba(255,60,60,0.1);color:#ff6060;border:1px solid rgba(255,60,60,0.2);border-radius:8px;padding:6px 14px;font-family:'Heebo',sans-serif;font-size:12px;cursor:pointer;transition:all 0.2s}
.btn-delete:hover{background:rgba(255,60,60,0.2)}
.enrollment-count{font-size:48px;font-weight:900;color:#ff3cbe;text-shadow:0 0 30px rgba(255,60,190,0.5)}
.stat-card{background:rgba(255,60,190,0.06);border:1px solid rgba(255,60,190,0.2);border-radius:16px;padding:24px;text-align:center}
.stat-card p{color:rgba(255,255,255,0.4);font-size:13px;margin-top:8px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:32px}
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">🎓 ניהול אקדמיה</div>
  <div class="nav-links">
    <a href="index.html">דף ראשי</a>
    <button onclick="logout()" class="btn-secondary" style="padding:8px 20px;font-size:13px">יציאה</button>
  </div>
</nav>

<div class="container" style="max-width:900px;padding-top:40px">

  <div id="authCheck" style="display:none;text-align:center;padding:80px 0">
    <p style="color:rgba(255,255,255,0.4)">בודק הרשאות...</p>
  </div>

  <div id="adminContent" style="display:none">

    <h1 style="font-size:28px;font-weight:900;margin-bottom:8px">לוח ניהול</h1>
    <p style="color:rgba(255,255,255,0.4);margin-bottom:32px">קורס: לא משתעבדת לתוכן</p>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="enrollment-count" id="enrollCount">-</div>
        <p>נרשמות לקורס</p>
      </div>
      <div class="stat-card">
        <div class="enrollment-count" id="contentCount">-</div>
        <p>פריטי תוכן</p>
      </div>
      <div class="stat-card">
        <div class="enrollment-count" style="font-size:32px">₪197</div>
        <p>מחיר הקורס</p>
      </div>
    </div>

    <!-- Add Content -->
    <div class="admin-form">
      <h2>הוספת תוכן לקורס</h2>
      <div class="form-row">
        <div class="form-group">
          <label>כותרת</label>
          <input type="text" id="contentTitle" placeholder="שם השיעור / הפרק">
        </div>
        <div class="form-group">
          <label>סוג תוכן</label>
          <select id="contentType">
            <option value="video">וידאו (YouTube / Vimeo)</option>
            <option value="pdf">PDF</option>
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label>קישור (URL)</label>
        <input type="text" id="contentUrl" placeholder="https://youtube.com/... או קישור ל-PDF">
      </div>
      <div class="form-group" style="margin-bottom:20px">
        <label>סדר (מספר)</label>
        <input type="number" id="contentOrder" placeholder="1" value="1" style="width:120px">
      </div>
      <button class="btn-add" onclick="addContent()">הוסף לקורס</button>
      <span id="addStatus" style="margin-right:16px;font-size:13px;color:#ff3cbe"></span>
    </div>

    <!-- Content List -->
    <div class="admin-form">
      <h2>תוכן הקורס הנוכחי</h2>
      <div class="content-list" id="contentList">
        <p style="color:rgba(255,255,255,0.3);text-align:center;padding:20px">טוען...</p>
      </div>
    </div>

    <!-- Enrollments -->
    <div class="admin-form">
      <h2>נרשמות אחרונות</h2>
      <div id="enrollmentsList" style="color:rgba(255,255,255,0.4);font-size:14px">טוען...</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const COURSE_ID = 'lo-mishtabdet';
const ADMIN_EMAIL = 'moran@salon-hayazamiot.co.il'; // שני לאימייל שלך

async function init(){
  const { data: adminData } = await supabase
    .from('admins')
    .select('email')
    .eq('email', session.user.email)
    .single();

  if(!adminData){
    alert('גישה מורשית לאדמין בלבד');
    window.location.href = 'login.html';
    return;
  }

  document.getElementById('adminContent').style.display = 'block';
  loadContent();
  loadEnrollments();
}

async function loadContent(){
  const {data,error} = await supabase
    .from('course_content')
    .select('*')
    .eq('course_id', COURSE_ID)
    .order('order_num');

  document.getElementById('contentCount').textContent = data ? data.length : 0;

  if(!data || data.length === 0){
    document.getElementById('contentList').innerHTML = '<p style="color:rgba(255,255,255,0.3);text-align:center;padding:20px">אין תוכן עדיין</p>';
    return;
  }

  document.getElementById('contentList').innerHTML = data.map(item => `
    <div class="content-item">
      <div class="item-info">
        <h4>${item.title}</h4>
        <span>${item.url.substring(0,60)}...</span>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="item-type">${item.type === 'video' ? 'וידאו' : 'PDF'}</span>
        <span style="color:rgba(255,255,255,0.3);font-size:12px">#${item.order_num}</span>
        <button class="btn-delete" onclick="deleteContent('${item.id}')">מחק</button>
      </div>
    </div>
  `).join('');
}

async function loadEnrollments(){
  const {data, count} = await supabase
    .from('enrollments')
    .select('*', {count:'exact'})
    .eq('course_id', COURSE_ID)
    .order('created_at', {ascending:false})
    .limit(10);

  document.getElementById('enrollCount').textContent = count || 0;

  if(!data || data.length === 0){
    document.getElementById('enrollmentsList').innerHTML = '<p style="color:rgba(255,255,255,0.3)">אין נרשמות עדיין</p>';
    return;
  }

  document.getElementById('enrollmentsList').innerHTML = `
    <table style="width:100%;border-collapse:collapse">
      <tr style="border-bottom:1px solid rgba(255,255,255,0.1)">
        <th style="text-align:right;padding:8px;color:rgba(255,255,255,0.4);font-size:12px">User ID</th>
        <th style="text-align:right;padding:8px;color:rgba(255,255,255,0.4);font-size:12px">תאריך</th>
      </tr>
      ${data.map(e=>`
        <tr style="border-bottom:1px solid rgba(255,255,255,0.05)">
          <td style="padding:8px;font-size:12px;color:rgba(255,255,255,0.6)">${e.user_id.substring(0,16)}...</td>
          <td style="padding:8px;font-size:12px;color:rgba(255,255,255,0.4)">${new Date(e.created_at).toLocaleDateString('he-IL')}</td>
        </tr>
      `).join('')}
    </table>
  `;
}

async function addContent(){
  const title = document.getElementById('contentTitle').value.trim();
  const type  = document.getElementById('contentType').value;
  const url   = document.getElementById('contentUrl').value.trim();
  const order = parseInt(document.getElementById('contentOrder').value) || 1;

  if(!title || !url){ alert('יש למלא כותרת וקישור'); return; }

  const {error} = await supabase.from('course_content').insert({
    course_id: COURSE_ID, title, type, url, order_num: order
  });

  if(error){ alert('שגיאה: ' + error.message); return; }

  document.getElementById('addStatus').textContent = '✓ נוסף בהצלחה!';
  setTimeout(()=>{ document.getElementById('addStatus').textContent=''; }, 3000);
  document.getElementById('contentTitle').value='';
  document.getElementById('contentUrl').value='';
  loadContent();
}

async function deleteContent(id){
  if(!confirm('למחוק פריט זה?')) return;
  await supabase.from('course_content').delete().eq('id', id);
  loadContent();
}

function logout(){
  supabase.auth.signOut();
  window.location.href='login.html';
}

init();
</script>
</body>
</html>
